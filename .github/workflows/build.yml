name: Isolated original native Copy/Paste control

on:
  push:
    branches:
      - diagnostic/native-copy-paste-control-f322
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-original-copy-paste-control:
    # Clipboard transfers create real Shell undo records. Keep this fixture
    # on a fresh disposable machine, separate from the native history suite.
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build native transfer fixture
        id: transfer-build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Exercise original native Copy5 and the same normal Paste headlessly
        shell: pwsh
        env:
          WINDOWSEXPLORER_NATIVE_TRANSFER_TEST: '1'
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $reportPath = Join-Path $PWD 'artifacts/native-copy-paste-control.xml'
          ctest --test-dir build -C Release -R '^native_original_copy_paste_control$' --no-tests=error --verbose --test-output-size-passed 1048576 --test-output-size-failed 1048576 --output-junit $reportPath 2>&1 | Tee-Object -FilePath artifacts/native-copy-paste-control.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$transferReport = Get-Content -LiteralPath $reportPath -Raw
          $transferCases = @($transferReport.testsuite.testcase)
          if ($transferCases.Count -ne 1 -or $transferCases[0].name -ne 'native_original_copy_paste_control' -or
              $transferCases[0].status -ne 'run' -or $null -ne $transferCases[0].SelectSingleNode('skipped') -or
              $null -ne $transferCases[0].SelectSingleNode('failure')) {
            throw 'The dedicated native transfer job requires one actual passing test; a skip is not verification.'
          }
      - name: Upload original Copy/Paste control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-copy-paste-control-reports
          path: |
            artifacts/native-copy-paste-control.xml
            artifacts/native-copy-paste-control.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
